<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NightDeck — Staff Night Results</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app">
    <div class="brand">
      <div class="brand-mark">ND</div>
      <div>
        <h1>NightDeck</h1>
        <p>Staff Night — that's a wrap.</p>
      </div>
    </div>

    <section class="card stack primary-action">
      <div class="end-hero">
        <div class="trophy" aria-hidden="true">★</div>
        <h2 style="margin:0">Final podium</h2>
        <p class="muted" style="margin:0.35rem 0 0">Trivia · Identify · Music — brag responsibly.</p>
      </div>
      <div class="row" style="justify-content:center; gap:0.4rem">
        <span class="pill" id="roomPill">—</span>
        <span class="pill soft" id="roundPill">—</span>
      </div>
      <p class="muted center" id="summaryLine"></p>
      <div class="scoreboard" id="scores"></div>
      <div>
        <div class="muted" style="margin-bottom:0.35rem">Share this</div>
        <pre class="share-box" id="shareBox"></pre>
      </div>
      <div class="row">
        <button class="btn" id="copyBtn" type="button">Copy results</button>
        <a class="btn secondary" href="index.html" id="againLink">Host another night</a>
      </div>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/room.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Room = NightDeckRoom;
      const Game = NightDeckGame;

      const session = Room.loadSession();
      const room = session ? Room.readRoom(session.code) : null;
      if (!room) {
        UI.$("#shareBox").textContent =
          "No room found. Head back to the NightDeck lobby and open one.";
        UI.$("#summaryLine").textContent = "";
        return;
      }
      if (room.status !== "ended" && room.status !== "playing") {
        location.href = "index.html";
        return;
      }

      UI.$("#roomPill").textContent = room.code;
      UI.$("#roundPill").textContent =
        room.round + " round" + (room.round === 1 ? "" : "s");

      const history = room.history || [];
      const types = {};
      history.forEach((h) => {
        types[h.type] = (types[h.type] || 0) + 1;
      });
      const mix = ["trivia", "identify", "music"]
        .filter((t) => types[t])
        .map((t) => types[t] + " " + t)
        .join(" · ");

      UI.$("#summaryLine").textContent =
        (mix || "Trivia · Identify · Music") +
        " · " +
        room.players.length +
        " players";

      const scores = UI.$("#scores");
      scores.innerHTML = "";
      Game.rankedPlayers(room).forEach((p, i) => {
        const row = document.createElement("div");
        row.className = "score-row" + (i === 0 ? " top" : "");
        const medal = i === 0 ? " ★" : i === 1 ? " ◆" : i === 2 ? " ●" : "";
        const bot = p.bot ? " · bot" : "";
        const you = session && p.id === session.playerId ? " (you)" : "";
        row.innerHTML =
          '<span class="rank">' +
          (i + 1) +
          '</span><span class="who">' +
          UI.escapeHtml(p.name) +
          you +
          bot +
          medal +
          '</span><span class="pts">' +
          p.score +
          "</span>";
        scores.appendChild(row);
      });

      const text = Game.shareText(room);
      UI.$("#shareBox").textContent = text;
      UI.$("#copyBtn").onclick = () => UI.copyText(text);

      UI.$("#againLink").addEventListener("click", () => {
        Room.clearSession();
      });
    })();
  </script>
</body>
</html>
