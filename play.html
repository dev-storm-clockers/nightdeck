<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NightDeck — Play</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app">
    <div class="brand">
      <div class="brand-mark">ND</div>
      <div>
        <h1>NightDeck</h1>
        <p id="metaLine">In progress…</p>
      </div>
    </div>

    <section class="card stack phase-card">
      <div class="row" style="justify-content:space-between">
        <span class="pill" id="roundPill">Round</span>
        <span class="pill warn" id="phasePill">phase</span>
        <span class="pill soft" id="roomPill">room</span>
      </div>
      <div class="prompt-wrap">
        <div class="prompt-label">This round's prompt</div>
        <div class="prompt-card" id="promptCard">…</div>
      </div>
      <div class="role-line" id="roleLine">You're up.</div>
      <div class="muted" id="judgeLine">Judge: —</div>
      <div class="judge-banner hidden" id="judgeBanner">
        <strong>You're judging — take your time.</strong>
        Grab a snack. Debate. No clock is chasing you.
      </div>
    </section>

    <section class="card stack" id="handSection">
      <h2>Your hand</h2>
      <p class="muted" id="handHint">Pick the card that makes the table lose it.</p>
      <div class="hand" id="hand"></div>
      <button class="btn block" id="submitBtn" type="button" disabled>Play this card</button>
    </section>

    <section class="card stack" id="judgeSection">
      <h2 id="tableTitle">On the table</h2>
      <p class="muted" id="judgeHint">Waiting on the crew…</p>
      <div class="submissions" id="submissions"></div>
      <button class="btn block" id="pickBtn" type="button" disabled>That's the winner</button>
    </section>

    <section class="card stack hidden" id="revealSection">
      <h2>Round champ</h2>
      <p id="winnerLine" class="prompt-card"></p>
      <button class="btn block" id="nextBtn" type="button">Deal the next one</button>
    </section>

    <section class="card stack scores-card">
      <h2>Scoreboard</h2>
      <div class="scoreboard" id="scores"></div>
      <div class="row">
        <button class="btn danger" id="endBtn" type="button">Call it a night</button>
        <a class="btn ghost" href="index.html">Back to lobby</a>
      </div>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/room.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Room = NightDeckRoom;
      const Game = NightDeckGame;

      const session = Room.loadSession();
      if (!session) {
        location.href = "index.html";
        return;
      }

      let selectedAnswer = null;
      let selectedWinnerId = null;

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
      }

      function phaseLabel(phase) {
        if (phase === "submit") return "play a card";
        if (phase === "judge") return "judging";
        if (phase === "reveal") return "reveal";
        return phase;
      }

      function render() {
        const room = Room.readRoom(session.code);
        if (!room) {
          UI.toast("Room went missing");
          location.href = "index.html";
          return;
        }
        if (room.status === "lobby") {
          location.href = "index.html";
          return;
        }
        if (room.status === "ended") {
          location.href = "end.html";
          return;
        }

        Game.runBotTurns(room);

        const me = room.players.find((p) => p.id === session.playerId);
        const judge = Game.currentJudge(room);
        const iAmJudge = judge && judge.id === session.playerId;

        UI.$("#metaLine").textContent =
          (room.deckSnapshot?.name || room.deckId) +
          " · " + room.players.length + " at the table";
        UI.$("#roundPill").textContent = "Round " + room.round + " of " + room.roundCap;
        UI.$("#phasePill").textContent = phaseLabel(room.phase);
        UI.$("#roomPill").textContent = room.code;
        UI.$("#promptCard").textContent = room.prompt || "…";
        UI.$("#judgeLine").textContent =
          "Judge tonight: " + (judge ? judge.name : "—") + (judge && judge.bot ? " (bot)" : "");
        UI.$("#roleLine").textContent = iAmJudge
          ? "You're judging — sit back and crown a winner when you're ready."
          : "You're playing — drop one blind card and wait for the laugh.";

        const banner = UI.$("#judgeBanner");
        if (room.phase === "judge") {
          banner.classList.remove("hidden");
          const rem = Game.judgeRemainingMs(room);
          const soft = rem != null ? " Soft clock: ~" + Game.formatDuration(rem) + " left — ignore it if you want." : "";
          if (iAmJudge) {
            banner.innerHTML =
              "<strong>You're judging — take your time.</strong> Grab a snack. Debate. No auto-skip." + soft;
          } else {
            banner.innerHTML =
              "<strong>Judge is thinking.</strong> Stretch. Refill. Nobody's rushing this." + soft;
          }
        } else {
          banner.classList.add("hidden");
        }

        const scores = UI.$("#scores");
        scores.innerHTML = "";
        Game.rankedPlayers(room).forEach((p, i) => {
          const row = document.createElement("div");
          row.className = "score-row" + (i === 0 ? " top" : "");
          const you = p.id === session.playerId ? " (you)" : "";
          const j = judge && judge.id === p.id ? " ★" : "";
          const bot = p.bot ? " · bot" : "";
          row.innerHTML =
            "<span>" + escapeHtml(p.name) + you + bot + j + "</span><strong>" + p.score + "</strong>";
          scores.appendChild(row);
        });

        const handSec = UI.$("#handSection");
        const judgeSec = UI.$("#judgeSection");
        const revealSec = UI.$("#revealSection");

        if (room.phase === "reveal") {
          handSec.classList.add("hidden");
          judgeSec.classList.add("hidden");
          revealSec.classList.remove("hidden");
          const winner = room.players.find((p) => p.id === room.winnerId);
          UI.$("#winnerLine").textContent =
            (winner ? winner.name : "?") + " lands it with: “" + (room.winnerAnswer || "") + "”";
          UI.$("#nextBtn").disabled = false;
        } else {
          revealSec.classList.add("hidden");
          handSec.classList.toggle("hidden", iAmJudge || room.phase !== "submit");
          judgeSec.classList.remove("hidden");

          const handEl = UI.$("#hand");
          handEl.innerHTML = "";
          selectedAnswer = null;
          UI.$("#submitBtn").disabled = true;
          if (!iAmJudge && room.phase === "submit") {
            const already = !!room.submissions[session.playerId];
            UI.$("#handHint").textContent = already
              ? "Card's in. Waiting on the rest of the table…"
              : "Pick the card that makes the table lose it.";
            const hand = (room.hands && room.hands[session.playerId]) || [];
            hand.forEach((text) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "answer-card";
              btn.textContent = text;
              btn.disabled = already;
              btn.onclick = () => {
                if (already) return;
                selectedAnswer = text;
                UI.$all(".answer-card", handEl).forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                UI.$("#submitBtn").disabled = false;
              };
              handEl.appendChild(btn);
            });
          }

          const subEl = UI.$("#submissions");
          subEl.innerHTML = "";
          selectedWinnerId = null;
          UI.$("#pickBtn").disabled = true;
          UI.$("#pickBtn").classList.toggle("hidden", !iAmJudge || room.phase !== "judge");
          const entries = Game.getBlindSubmissions(room);
          const needed = room.players.filter((p) => !judge || p.id !== judge.id).length;
          const count = Object.keys(room.submissions || {}).length;

          if (room.phase === "submit") {
            UI.$("#tableTitle").textContent = "On the table";
            UI.$("#judgeHint").textContent =
              count + " of " + needed + " cards in. Faces down until everyone's played.";
            for (let i = 0; i < count; i++) {
              const div = document.createElement("div");
              div.className = "submission sealed";
              div.textContent = "Sealed card";
              div.style.pointerEvents = "none";
              subEl.appendChild(div);
            }
          } else if (room.phase === "judge") {
            UI.$("#tableTitle").textContent = iAmJudge ? "Pick a winner" : "The contenders";
            UI.$("#judgeHint").textContent = iAmJudge
              ? "Tap the funniest. Names stay hidden until you crown someone."
              : "Judge is choosing — no rush.";
            entries.forEach((e) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "submission";
              btn.textContent = e.text;
              if (iAmJudge) {
                btn.onclick = () => {
                  selectedWinnerId = e.playerId;
                  UI.$all(".submission", subEl).forEach((b) => b.classList.remove("winner"));
                  btn.classList.add("winner");
                  UI.$("#pickBtn").disabled = false;
                };
              } else {
                btn.style.pointerEvents = "none";
              }
              subEl.appendChild(btn);
            });
          }
        }
      }

      UI.$("#submitBtn").onclick = () => {
        if (!selectedAnswer) return;
        const room = Room.readRoom(session.code);
        const res = Game.submitAnswer(room, session.playerId, selectedAnswer);
        if (!res.ok) return UI.toast(res.error);
        Game.runBotTurns(room);
        UI.toast(res.allIn || room.phase === "judge" ? "All in — judge time" : "Played");
        render();
      };

      UI.$("#pickBtn").onclick = () => {
        if (!selectedWinnerId) return;
        const room = Room.readRoom(session.code);
        const res = Game.pickWinner(room, session.playerId, selectedWinnerId);
        if (!res.ok) return UI.toast(res.error);
        UI.toast("Winner locked in");
        render();
      };

      UI.$("#nextBtn").onclick = () => {
        const room = Room.readRoom(session.code);
        const res = Game.nextRound(room);
        if (!res.ok) return UI.toast(res.error);
        if (res.ended) {
          location.href = "end.html";
          return;
        }
        render();
      };

      UI.$("#endBtn").onclick = () => {
        const room = Room.readRoom(session.code);
        if (!room) return;
        if (session.playerId !== room.hostId) {
          return UI.toast("Only the host can wrap it up");
        }
        Game.endGame(room);
        location.href = "end.html";
      };

      Room.subscribe((code) => {
        if (code === session.code) render();
      });
      window.addEventListener("storage", (e) => {
        if (e.key === "nightdeck:room:" + session.code) render();
      });

      render();
      setInterval(() => {
        if (selectedAnswer || selectedWinnerId) {
          const room = Room.readRoom(session.code);
          if (room && room.status === "playing") Game.runBotTurns(room);
          return;
        }
        render();
      }, 900);
    })();
  </script>
</body>
</html>
