<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NightDeck — Play</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app play-app">
    <header class="play-header">
      <div class="brand play-brand">
        <div class="brand-mark">ND</div>
        <div>
          <h1>NightDeck</h1>
          <p id="metaLine">Loading…</p>
        </div>
      </div>
      <div class="score-chip">
        <div class="lbl">Score</div>
        <div class="val" id="scoreVal">0</div>
      </div>
    </header>

    <div class="status-bar">
      <span class="pill" id="qPill">Q 0/0</span>
      <span class="pill" id="typePill">—</span>
      <span class="pill" id="dayPill">—</span>
    </div>

    <section class="card stack round-card" id="roundSection">
      <div class="prompt-card" id="promptCard">
        <div class="kicker" id="promptKicker">Question</div>
        <div class="clue hidden" id="promptClue"></div>
        <div class="big" id="promptBig">…</div>
        <div class="hint hidden" id="promptHint"></div>
      </div>

      <div class="progress-row">
        <div class="lock-meter" id="lockMeter" aria-hidden="true"><i id="progressBar" style="width:0%"></i></div>
        <span class="waiting-chip" id="progChip">0 / 0</span>
      </div>

      <div id="answerArea">
        <div class="options" id="options" role="group" aria-label="Answer options"></div>
        <div class="typed-row hidden" id="typedWrap">
          <label class="typed-label" style="flex:1;margin:0">
            <span class="sr-only">Type your guess</span>
            <input id="typedGuess" type="text" maxlength="80" placeholder="Or type a guess…" autocomplete="off" />
          </label>
          <button class="btn lock-btn" id="lockBtn" type="button" disabled>Lock in</button>
        </div>
        <p class="muted tight" id="lockedNote"></p>
      </div>

      <div class="reveal-banner hidden" id="revealBanner"></div>
    </section>

    <section class="play-dock" id="playDock">
      <div class="play-dock-actions">
        <button class="btn ok hidden" id="nextBtn" type="button">Next question</button>
        <a class="btn ghost" href="board.html" id="boardBtn">Leaderboard</a>
      </div>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;
      const Catalog = NightDeckCatalog;

      const session = Sync.loadSession();
      if (!session || !session.dayCode || !session.gameType) {
        location.href = "index.html";
        return;
      }

      let run = Sync.loadRun();
      let selectedOption = null;
      let pack = null;

      UI.$("#boardBtn").href = "board.html?d=" + encodeURIComponent(session.dayCode);

      function fillPrompt(item) {
        const clue = UI.$("#promptClue");
        const hint = UI.$("#promptHint");
        clue.classList.add("hidden");
        hint.classList.add("hidden");
        if (item.type === "trivia") {
          UI.$("#promptKicker").textContent = "Trivia";
          UI.$("#promptBig").textContent = item.q;
        } else if (item.type === "identify") {
          UI.$("#promptKicker").textContent = "Identify";
          UI.$("#promptBig").textContent = item.prompt;
          if (item.clue) {
            clue.textContent = item.clue;
            clue.classList.remove("hidden");
          }
        } else {
          UI.$("#promptKicker").textContent = "Music";
          UI.$("#promptBig").textContent = "“" + item.cue + "”";
          if (item.hint) {
            hint.textContent = item.hint;
            hint.classList.remove("hidden");
          }
        }
      }

      function renderOptions() {
        const cur = Game.currentQuestion(run);
        if (!cur) return;
        const item = cur.item;
        const optsEl = UI.$("#options");
        const typedWrap = UI.$("#typedWrap");
        const typedGuess = UI.$("#typedGuess");
        const lockBtn = UI.$("#lockBtn");
        optsEl.innerHTML = "";
        const hasOptions = Array.isArray(item.options) && item.options.length > 0;
        const allowTyped = item.type !== "trivia";
        const letters = "ABCD";
        const revealing = run.phase === "reveal";

        if (hasOptions) {
          item.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "option-btn";
            btn.innerHTML =
              '<span class="opt-letter">' + letters[idx] + '</span><span class="opt-text">' +
              UI.escapeHtml(opt) + "</span>";
            if (revealing || run.phase !== "answering") {
              btn.disabled = true;
              if (run.currentGuess === opt) btn.classList.add("selected");
              const isCorrect =
                item.type === "trivia"
                  ? opt === item.answer
                  : opt === item.answer || Game.matchesAccept(opt, item);
              if (isCorrect) btn.classList.add("correct");
              else if (run.currentGuess === opt) btn.classList.add("wrong");
            } else {
              btn.onclick = () => {
                selectedOption = opt;
                UI.$all(".option-btn", optsEl).forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                typedGuess.value = "";
                lockBtn.disabled = false;
              };
            }
            optsEl.appendChild(btn);
          });
        }

        if (run.phase === "answering") {
          typedWrap.classList.toggle("hidden", !allowTyped && hasOptions);
          if (!hasOptions) typedWrap.classList.remove("hidden");
          if (allowTyped) {
            typedGuess.disabled = false;
            typedGuess.placeholder = hasOptions ? "Or type a guess…" : "Type your guess…";
          } else {
            typedGuess.disabled = true;
            typedGuess.placeholder = "Pick an option above";
            if (hasOptions) typedWrap.classList.add("hidden");
          }
          lockBtn.classList.remove("hidden");
          lockBtn.disabled = !(selectedOption || (allowTyped && typedGuess.value.trim()));
        } else {
          typedWrap.classList.add("hidden");
        }
      }

      function render() {
        if (!run) return;
        if (run.phase === "done") {
          finish();
          return;
        }
        const prog = Game.progress(run);
        UI.$("#metaLine").textContent =
          session.name + " · " + Game.typeLabel(run.gameType);
        UI.$("#scoreVal").textContent = String(run.score);
        UI.$("#qPill").textContent = "Q " + prog.index + "/" + prog.total;
        UI.$("#typePill").textContent = Game.typeLabel(run.gameType);
        UI.$("#typePill").className = "pill " + run.gameType;
        UI.$("#dayPill").textContent = session.dayCode;
        const pct = prog.total ? Math.round((run.cursor / prog.total) * 100) : 0;
        UI.$("#progressBar").style.width = pct + "%";
        UI.$("#progChip").textContent = prog.index + " / " + prog.total;

        const cur = Game.currentQuestion(run);
        if (!cur) return;
        fillPrompt(cur.item);
        renderOptions();

        const banner = UI.$("#revealBanner");
        if (run.phase === "reveal") {
          banner.classList.remove("hidden");
          banner.classList.toggle("miss", !run.currentCorrect);
          banner.innerHTML =
            '<span class="reveal-label">' +
            (run.currentCorrect ? "Correct · +1" : "Answer") +
            '</span><span class="reveal-value">' +
            UI.escapeHtml(cur.item.answer) +
            "</span>";
          UI.$("#lockedNote").textContent = "";
          UI.$("#nextBtn").classList.remove("hidden");
          UI.$("#nextBtn").textContent =
            run.cursor + 1 >= run.queue.length ? "Finish & submit score" : "Next question";
        } else {
          banner.classList.add("hidden");
          UI.$("#lockedNote").textContent = "Select an answer, then lock in.";
          UI.$("#nextBtn").classList.add("hidden");
        }
      }

      async function finish() {
        Sync.saveRun(run);
        try {
          if (!session.solo) {
            await Sync.submitScore({
              code: session.dayCode,
              playerId: session.playerId,
              score: run.score,
            });
          } else {
            const day = session.day || { code: session.dayCode, players: [] };
            const p = (day.players || []).find((x) => x.id === session.playerId);
            if (p) {
              p.score = run.score;
              p.finishedAt = Date.now();
            }
            session.day = day;
            Sync.saveSession(session);
          }
        } catch (err) {
          UI.toast(err.message || "Score sync failed — results still local");
        }
        location.href = "end.html";
      }

      async function boot() {
        try {
          pack = await Catalog.loadPack(session.gameType);
          if (!run || run.dayCode !== session.dayCode || run.playerId !== session.playerId) {
            run = Game.startRun({
              gameType: session.gameType,
              pack,
              dayCode: session.dayCode,
              playerId: session.playerId,
              playerName: session.name,
            });
            Sync.saveRun(run);
          }
          render();
        } catch (err) {
          UI.toast(err.message || "Could not load pack");
          UI.$("#promptBig").textContent = err.message || "Load failed";
        }
      }

      UI.$("#typedGuess").addEventListener("input", () => {
        selectedOption = null;
        UI.$all(".option-btn").forEach((b) => b.classList.remove("selected"));
        UI.$("#lockBtn").disabled = !UI.$("#typedGuess").value.trim();
      });
      UI.$("#typedGuess").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          UI.$("#lockBtn").click();
        }
      });
      UI.$("#lockBtn").onclick = () => {
        if (!run || run.phase !== "answering") return;
        const text = selectedOption || UI.$("#typedGuess").value.trim();
        const res = Game.lockAndReveal(run, text);
        if (!res.ok) return UI.toast(res.error);
        Sync.saveRun(run);
        selectedOption = null;
        render();
      };
      UI.$("#nextBtn").onclick = () => {
        const res = Game.nextQuestion(run);
        if (!res.ok) return UI.toast(res.error);
        Sync.saveRun(run);
        selectedOption = null;
        UI.$("#typedGuess").value = "";
        if (res.done) finish();
        else render();
      };

      boot();
    })();
  </script>
</body>
</html>
