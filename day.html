<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightDeck — Join</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app">
    <div class="brand">
      <img src="assets/logo.png" alt="NightDeck" class="brand-logo" />
      <div>
        <h1>NightDeck</h1>
        <p id="subtitle">Loading…</p>
      </div>
    </div>

    <section class="card stack hidden" id="errorCard">
      <div class="error-banner" id="errorText">Day not found.</div>
      <a class="btn secondary block" href="index.html">Back</a>
    </section>

    <section class="card stack primary-action hidden" id="joinPanel">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">Join</h2>
        <span class="pill" id="typePill">—</span>
      </div>
      <div class="join-code-card">
        <div class="day-code" id="dayCode">—————</div>
        <p class="muted tight" id="dayMeta" style="margin-top:0.4rem"></p>
      </div>
      <label>Your name
        <input id="playerName" type="text" maxlength="24" placeholder="Nickname" autocomplete="nickname" />
      </label>
      <button class="btn block card-btn" id="startBtn" type="button">Start</button>
      <a class="btn ghost block center" id="boardLink" href="#">Leaderboard</a>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;

      const code = (UI.qs("d") || "").trim().toUpperCase();
      const soloFlag = UI.qs("solo") === "1";
      let day = null;

      async function load() {
        if (!code) {
          showError("Missing day code.");
          return;
        }
        if (soloFlag) {
          const session = Sync.loadSession();
          if (session && session.solo && session.day && session.dayCode === code) {
            day = session.day;
            renderJoin();
            return;
          }
          showError("Solo day not found on this device.");
          return;
        }
        try {
          day = await Sync.getDay(code);
          if (!day) {
            showError("Day not found.");
            return;
          }
          renderJoin();
        } catch (err) {
          showError(err.message || "Could not load day");
        }
      }

      function showError(msg) {
        UI.$("#subtitle").textContent = "Unavailable";
        UI.$("#errorCard").classList.remove("hidden");
        UI.$("#errorText").textContent = msg;
        UI.$("#joinPanel").classList.add("hidden");
      }

      function renderJoin() {
        const line = Game.typeLine(day.gameType, day.subject);
        UI.$("#subtitle").textContent = line;
        UI.$("#joinPanel").classList.remove("hidden");
        UI.$("#dayCode").textContent = day.code;
        UI.$("#typePill").textContent = Game.typeEmoji(day.gameType) + " " + line;
        UI.$("#typePill").className = "pill " + day.gameType;
        UI.$("#dayMeta").textContent =
          (day.hostName || "Host") +
          " · " +
          ((day.players && day.players.length) || 0) + " in" +
          (day.subject ? " · " + Game.subjectLabel(day.subject) : "");
        UI.$("#boardLink").href = "board.html?d=" + encodeURIComponent(day.code);
        const session = Sync.loadSession();
        if (session && session.dayCode === day.code && session.name) {
          UI.$("#playerName").value = session.name;
        }
      }

      UI.$("#startBtn").addEventListener("click", async () => {
        const name = UI.$("#playerName").value.trim();
        if (!name) {
          UI.toast("Enter your name");
          return;
        }
        UI.$("#startBtn").disabled = true;
        try {
          let playerId;
          if (day.solo || soloFlag) {
            playerId = Sync.makePlayerId();
            day.players = day.players || [];
            day.players.push({ id: playerId, name, score: 0, finishedAt: null });
            Sync.saveSession({
              dayCode: day.code,
              playerId,
              name,
              gameType: day.gameType,
              subject: day.subject || null,
              solo: true,
              day,
              deck: Array.isArray(day.deck) ? day.deck.slice() : null,
            });
          } else {
            const res = await Sync.joinDay({ code: day.code, name });
            if (!res.ok) {
              UI.toast(res.error);
              UI.$("#startBtn").disabled = false;
              return;
            }
            playerId = res.playerId;
            day = res.day;
            Sync.saveSession({
              dayCode: day.code,
              playerId,
              name,
              gameType: day.gameType,
              subject: day.subject || null,
              solo: false,
              deck: Array.isArray(day.deck) ? day.deck.slice() : null,
            });
          }
          Sync.clearRun();
          location.href = "play.html";
        } catch (err) {
          UI.toast(err.message || "Could not join");
          UI.$("#startBtn").disabled = false;
        }
      });

      load();
    })();
  </script>
</body>
</html>
