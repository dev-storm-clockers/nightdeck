<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightDeck</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app" id="app">
    <div class="brand">
      <div class="brand-mark">ND</div>
      <div>
        <h1>NightDeck</h1>
        <p>Staff Night</p>
      </div>
    </div>

    <section class="card stack primary-action" id="createCard">
      <h2>Create day</h2>
      <div class="game-type-grid" id="typeGrid" role="radiogroup" aria-label="Game type">
        <button type="button" class="game-type trivia" data-type="trivia" aria-pressed="false">
          <span class="emoji" aria-hidden="true">🧠</span>
          <strong>Trivia</strong>
          <span>A–D picks</span>
        </button>
        <button type="button" class="game-type identify" data-type="identify" aria-pressed="false">
          <span class="emoji" aria-hidden="true">🔍</span>
          <strong>Identify</strong>
          <span>What is it?</span>
        </button>
        <button type="button" class="game-type music" data-type="music" aria-pressed="false">
          <span class="emoji" aria-hidden="true">🎵</span>
          <strong>Music</strong>
          <span>Name that cue</span>
        </button>
      </div>
      <label>Your name
        <input id="hostName" type="text" maxlength="24" placeholder="Host name" autocomplete="nickname" />
      </label>
      <button class="btn block card-btn" id="createBtn" type="button">Create</button>
      <button class="btn secondary block" id="soloBtn" type="button">Solo demo</button>
      <p class="muted tight" id="createStatus"></p>
    </section>

    <section class="card stack hidden" id="createdCard">
      <h2>Day ready</h2>
      <div class="center">
        <div class="muted">Code · <span id="createdType">—</span></div>
        <div class="day-code" id="createdCode">—————</div>
      </div>
      <div class="link-box" id="createdLink"></div>
      <div class="row">
        <button class="btn" id="copyLinkBtn" type="button">Copy link</button>
        <a class="btn secondary" id="openDayBtn" href="#">Open</a>
        <a class="btn ghost" id="openBoardBtn" href="#">Board</a>
      </div>
      <button class="btn ghost block" id="anotherBtn" type="button">New day</button>
    </section>

    <section class="card stack" id="joinCard">
      <h2>Join</h2>
      <label>Day code
        <input id="joinCode" type="text" maxlength="8" placeholder="K7M2P" autocomplete="off" style="text-transform:uppercase;letter-spacing:0.12em;font-weight:800" />
      </label>
      <button class="btn secondary block card-btn" id="joinBtn" type="button">Go</button>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;
      let selectedType = null;

      function selectType(type) {
        selectedType = type;
        UI.$all(".game-type").forEach((btn) => {
          const on = btn.getAttribute("data-type") === type;
          btn.classList.toggle("selected", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      UI.$("#typeGrid").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-type]");
        if (!btn) return;
        selectType(btn.getAttribute("data-type"));
      });

      function showCreated(day, opts) {
        UI.$("#createCard").classList.add("hidden");
        UI.$("#createdCard").classList.remove("hidden");
        UI.$("#createdCode").textContent = day.code;
        UI.$("#createdType").textContent = Game.typeLabel(day.gameType);
        const link = Sync.dayUrl(day.code);
        UI.$("#createdLink").textContent = link;
        UI.$("#openDayBtn").href = "day.html?d=" + encodeURIComponent(day.code);
        UI.$("#openBoardBtn").href = "board.html?d=" + encodeURIComponent(day.code);
        if (opts && opts.solo) {
          UI.$("#createdLink").textContent = link + " (solo · this device)";
        }
      }

      UI.$("#createBtn").addEventListener("click", async () => {
        if (!selectedType) {
          UI.toast("Pick a game");
          return;
        }
        const hostName = UI.$("#hostName").value;
        UI.$("#createBtn").disabled = true;
        UI.$("#createStatus").textContent = "Creating…";
        try {
          const day = await Sync.createDay({ gameType: selectedType, hostName });
          showCreated(day);
          UI.toast("Day " + day.code);
        } catch (err) {
          UI.$("#createStatus").textContent = err.message || "Failed";
          UI.toast(err.message || "Create failed");
        } finally {
          UI.$("#createBtn").disabled = false;
        }
      });

      UI.$("#soloBtn").addEventListener("click", () => {
        if (!selectedType) {
          UI.toast("Pick a game");
          return;
        }
        const day = Sync.createSoloDay({
          gameType: selectedType,
          hostName: UI.$("#hostName").value || "You",
        });
        Sync.saveSession({
          dayCode: day.code,
          playerId: Sync.makePlayerId(),
          name: day.hostName,
          gameType: day.gameType,
          solo: true,
          day: day,
        });
        location.href = "day.html?d=" + encodeURIComponent(day.code) + "&solo=1";
      });

      UI.$("#copyLinkBtn").addEventListener("click", () => {
        UI.copyText(UI.$("#createdLink").textContent.replace(/\s*\(solo.*\)$/, ""));
      });

      UI.$("#anotherBtn").addEventListener("click", () => {
        UI.$("#createdCard").classList.add("hidden");
        UI.$("#createCard").classList.remove("hidden");
        UI.$("#createStatus").textContent = "";
      });

      UI.$("#joinBtn").addEventListener("click", () => {
        const code = UI.$("#joinCode").value.trim().toUpperCase();
        if (!code) {
          UI.toast("Enter a code");
          return;
        }
        location.href = "day.html?d=" + encodeURIComponent(code);
      });
    })();
  </script>
</body>
</html>
