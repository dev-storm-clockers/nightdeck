<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightDeck — Results</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app">
    <div class="brand brand-end">
      <img src="assets/logo.png" alt="NightDeck" class="brand-logo" />
    </div>

    <section class="card stack primary-action end-card">
      <img src="assets/finish.png" alt="" class="finish-hero" width="200" height="200" />
      <div class="center">
        <div class="podium-score" id="scoreBig">0<span class="score-of" id="scoreSub"> / 0</span></div>
      </div>
      <p class="muted center tight end-meta" id="metaLine">—</p>
      <a class="btn block card-btn" id="boardLink" href="#">Leaderboard</a>
      <button class="btn secondary block" id="copyBtn" type="button">Copy score</button>
      <a class="btn ghost block center" href="index.html" id="againLink">New day</a>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;
      const session = Sync.loadSession();
      const run = Sync.loadRun();
      if (!session || !run || run.phase !== "done") {
        if (session && session.dayCode) {
          location.href = "board.html?d=" + encodeURIComponent(session.dayCode);
        } else {
          location.href = "index.html";
        }
        return;
      }
      const total = run.queue.length;
      const subj = run.subject || session.subject || null;
      const name = session.name || "Player";
      const typePart = Game.typeLine(run.gameType, subj);
      UI.$("#scoreBig").innerHTML =
        String(run.score) +
        ' <span class="score-of" id="scoreSub">/ ' +
        total +
        "</span>";
      UI.$("#metaLine").textContent =
        typePart + " · " + name + " · " + session.dayCode;
      UI.$("#boardLink").href = "board.html?d=" + encodeURIComponent(session.dayCode);
      const text = Game.shareText({
        dayCode: session.dayCode,
        gameType: run.gameType,
        subject: subj,
        playerName: name,
        score: run.score,
        total,
      });
      UI.$("#copyBtn").onclick = () => UI.copyText(text);
      UI.$("#againLink").addEventListener("click", () => {
        Sync.clearSession();
        Sync.clearRun();
      });
    })();
  </script>
</body>
</html>
