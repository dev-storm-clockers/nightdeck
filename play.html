<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightDeck — Play</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app play-app">
    <header class="play-header">
      <div class="brand play-brand">
        <div class="brand-mark">ND</div>
        <div>
          <h1>NightDeck</h1>
          <p id="metaLine">Loading…</p>
        </div>
      </div>
      <div class="score-chip" aria-live="polite">
        <div class="lbl">Score</div>
        <div class="val" id="scoreVal">0</div>
      </div>
    </header>

    <div class="status-bar">
      <span class="pill" id="qPill">Q 0/0</span>
      <span class="pill" id="typePill">—</span>
      <span class="pill hidden" id="subjectPill">—</span>
      <span class="pill" id="dayPill">—</span>
    </div>

    <div class="hud-progress" aria-hidden="true">
      <div class="q-bar"><i id="progressBar" style="width:0%"></i></div>
      <span class="q-chip" id="progChip">0/0</span>
    </div>

    <div class="prompt-card" id="promptCard">
      <div class="kicker" id="promptKicker">Question</div>
      <div class="clue hidden" id="promptClue"></div>
      <div class="big" id="promptBig">…</div>
      <div class="hint hidden" id="promptHint"></div>
    </div>

    <div id="answerArea">
      <div class="options" id="options" role="group" aria-label="Answer options"></div>
      <div class="typed-row hidden" id="typedWrap">
        <label style="flex:1;margin:0;font-size:0;gap:0">
          <span class="sr-only">Type your guess</span>
          <input id="typedGuess" type="text" maxlength="80" placeholder="Type a guess…" autocomplete="off" enterkeyhint="done" />
        </label>
        <button class="btn lock-btn" id="lockBtn" type="button" disabled>Lock in</button>
      </div>
    </div>

    <div class="reveal-banner hidden" id="revealBanner"></div>
  </main>

  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <button class="btn ok card-btn hidden" id="nextBtn" type="button">Next</button>
      <div class="action-bar-links">
        <a href="board.html" id="boardBtn">Leaderboard</a>
      </div>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;
      const Catalog = NightDeckCatalog;

      const session = Sync.loadSession();
      if (!session || !session.dayCode || !session.gameType) {
        location.href = "index.html";
        return;
      }

      let run = Sync.loadRun();
      let locking = false;
      let pack = null;

      UI.$("#boardBtn").href = "board.html?d=" + encodeURIComponent(session.dayCode);

      function fillPrompt(item) {
        const clue = UI.$("#promptClue");
        const hint = UI.$("#promptHint");
        clue.classList.add("hidden");
        hint.classList.add("hidden");
        if (item.type === "trivia") {
          const subj = (run && run.subject) || session.subject;
          UI.$("#promptKicker").textContent = subj
            ? "Trivia · " + Game.subjectLabel(subj)
            : "Trivia";
          UI.$("#promptBig").textContent = item.q;
        } else if (item.type === "identify") {
          UI.$("#promptKicker").textContent = "Identify";
          UI.$("#promptBig").textContent = item.prompt;
          if (item.clue) {
            clue.textContent = item.clue;
            clue.classList.remove("hidden");
          }
        } else {
          UI.$("#promptKicker").textContent = "Music";
          UI.$("#promptBig").textContent = "“" + item.cue + "”";
          if (item.hint) {
            hint.textContent = item.hint;
            hint.classList.remove("hidden");
          }
        }
      }

      function doLock(text, flashEl) {
        if (!run || run.phase !== "answering" || locking) return;
        const guess = String(text || "").trim();
        if (!guess) {
          UI.toast("Pick or type something");
          return;
        }
        locking = true;
        if (flashEl) {
          flashEl.classList.add("selected", "flash");
          UI.$all(".option-btn").forEach((b) => {
            if (b !== flashEl) b.disabled = true;
          });
        }
        const apply = () => {
          const res = Game.lockAndReveal(run, guess);
          if (!res.ok) {
            locking = false;
            UI.toast(res.error);
            return;
          }
          Sync.saveRun(run);
          render();
          locking = false;
        };
        if (flashEl) setTimeout(apply, 180);
        else apply();
      }

      function renderOptions() {
        const cur = Game.currentQuestion(run);
        if (!cur) return;
        const item = cur.item;
        const optsEl = UI.$("#options");
        const typedWrap = UI.$("#typedWrap");
        const typedGuess = UI.$("#typedGuess");
        const lockBtn = UI.$("#lockBtn");
        optsEl.innerHTML = "";
        const hasOptions = Array.isArray(item.options) && item.options.length > 0;
        const allowTyped = item.type !== "trivia";
        const letters = "ABCD";
        const revealing = run.phase === "reveal";

        if (hasOptions) {
          item.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "option-btn";
            btn.innerHTML =
              '<span class="opt-letter">' + letters[idx] + '</span><span class="opt-text">' +
              UI.escapeHtml(opt) + "</span>";
            if (revealing || run.phase !== "answering") {
              btn.disabled = true;
              if (run.currentGuess === opt) btn.classList.add("selected");
              // Exactly one correct option: index or exact answer text — never loose accept/includes
              const isCorrect = Game.isOptionCorrect(item, opt, idx);
              if (isCorrect) btn.classList.add("correct");
              else if (run.currentGuess === opt) btn.classList.add("wrong");
            } else {
              // One gesture: tap option = select + lock + reveal
              btn.addEventListener("click", (e) => {
                e.preventDefault();
                doLock(opt, btn);
              });
            }
            optsEl.appendChild(btn);
          });
        }

        if (run.phase === "answering") {
          const showTyped = allowTyped || !hasOptions;
          typedWrap.classList.toggle("hidden", !showTyped);
          if (showTyped) {
            typedGuess.disabled = false;
            typedGuess.placeholder = hasOptions ? "Or type a guess…" : "Type your guess…";
            lockBtn.disabled = !typedGuess.value.trim();
          }
        } else {
          typedWrap.classList.add("hidden");
        }
      }

      function render() {
        if (!run) return;
        if (run.phase === "done") {
          finish();
          return;
        }
        const prog = Game.progress(run);
        const subj = run.subject || session.subject || null;
        UI.$("#metaLine").textContent =
          session.name + " · " + Game.typeLine(run.gameType, subj);
        UI.$("#scoreVal").textContent = String(run.score);
        UI.$("#qPill").textContent = "Q " + prog.index + "/" + prog.total;
        UI.$("#typePill").textContent = Game.typeLabel(run.gameType);
        UI.$("#typePill").className = "pill " + run.gameType;
        const subPill = UI.$("#subjectPill");
        if (run.gameType === "trivia" && subj) {
          subPill.textContent = Game.subjectLabel(subj);
          subPill.classList.remove("hidden");
        } else {
          subPill.classList.add("hidden");
        }
        UI.$("#dayPill").textContent = session.dayCode;
        const pct = prog.total ? Math.round((run.cursor / prog.total) * 100) : 0;
        UI.$("#progressBar").style.width = pct + "%";
        UI.$("#progChip").textContent = prog.index + "/" + prog.total;

        const cur = Game.currentQuestion(run);
        if (!cur) return;
        fillPrompt(cur.item);
        renderOptions();

        const banner = UI.$("#revealBanner");
        const nextBtn = UI.$("#nextBtn");
        if (run.phase === "reveal") {
          banner.classList.remove("hidden");
          banner.classList.toggle("miss", !run.currentCorrect);
          banner.innerHTML =
            '<span class="reveal-label">' +
            (run.currentCorrect ? "Correct · +1" : "Answer") +
            '</span><span class="reveal-value">' +
            UI.escapeHtml(cur.item.answer) +
            "</span>";
          nextBtn.classList.remove("hidden");
          nextBtn.textContent =
            run.cursor + 1 >= run.queue.length ? "Finish" : "Next";
        } else {
          banner.classList.add("hidden");
          nextBtn.classList.add("hidden");
        }
      }

      async function finish() {
        Sync.saveRun(run);
        try {
          if (!session.solo) {
            await Sync.submitScore({
              code: session.dayCode,
              playerId: session.playerId,
              score: run.score,
            });
          } else {
            const day = session.day || { code: session.dayCode, players: [] };
            const p = (day.players || []).find((x) => x.id === session.playerId);
            if (p) {
              p.score = run.score;
              p.finishedAt = Date.now();
            }
            session.day = day;
            Sync.saveSession(session);
          }
        } catch (err) {
          UI.toast(err.message || "Score sync failed — results still local");
        }
        location.href = "end.html";
      }

      async function boot() {
        try {
          let subject = session.subject || null;
          if (session.gameType === "trivia" && !subject && !session.solo) {
            try {
              const day = await Sync.getDay(session.dayCode);
              if (day && day.subject) {
                subject = day.subject;
                session.subject = subject;
                Sync.saveSession(session);
              }
            } catch (e) { /* keep going */ }
          }
          if (session.gameType === "trivia" && session.solo && session.day && session.day.subject) {
            subject = session.day.subject;
            session.subject = subject;
          }
          pack = await Catalog.loadPack(session.gameType, subject);
          if (!run || run.dayCode !== session.dayCode || run.playerId !== session.playerId) {
            run = Game.startRun({
              gameType: session.gameType,
              pack,
              dayCode: session.dayCode,
              playerId: session.playerId,
              playerName: session.name,
            });
            Sync.saveRun(run);
          }
          render();
        } catch (err) {
          UI.toast(err.message || "Could not load pack");
          UI.$("#promptBig").textContent = err.message || "Load failed";
        }
      }

      UI.$("#typedGuess").addEventListener("input", () => {
        UI.$("#lockBtn").disabled = !UI.$("#typedGuess").value.trim();
      });
      UI.$("#typedGuess").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doLock(UI.$("#typedGuess").value);
        }
      });
      UI.$("#lockBtn").addEventListener("click", (e) => {
        e.preventDefault();
        doLock(UI.$("#typedGuess").value);
      });
      UI.$("#nextBtn").addEventListener("click", (e) => {
        e.preventDefault();
        if (!run || run.phase !== "reveal") return;
        const res = Game.nextQuestion(run);
        if (!res.ok) return UI.toast(res.error);
        Sync.saveRun(run);
        UI.$("#typedGuess").value = "";
        if (res.done) finish();
        else render();
      });

      boot();
    })();
  </script>
</body>
</html>
