<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightDeck — Results</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="app">
    <div class="brand">
      <div class="brand-mark">ND</div>
      <div>
        <h1>NightDeck</h1>
        <p>Done</p>
      </div>
    </div>

    <section class="card stack primary-action">
      <div class="end-hero">
        <div class="trophy" aria-hidden="true">★</div>
        <h2 style="margin:0">Score</h2>
        <p class="muted tight" style="margin-top:0.35rem" id="typeLine">—</p>
      </div>
      <div class="center">
        <div class="podium-score" id="scoreBig">0</div>
        <p class="muted" id="scoreSub">/ 0</p>
      </div>
      <div class="row" style="justify-content:center;gap:0.4rem">
        <span class="pill" id="dayPill">—</span>
        <span class="pill" id="namePill">—</span>
      </div>
      <pre class="share-box" id="shareBox"></pre>
      <button class="btn block card-btn" id="copyBtn" type="button">Copy share</button>
      <a class="btn secondary block" id="boardLink" href="#">Leaderboard</a>
      <a class="btn ghost block center" href="index.html" id="againLink">New day</a>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      const UI = NightDeckUI;
      const Sync = NightDeckSync;
      const Game = NightDeckGame;
      const session = Sync.loadSession();
      const run = Sync.loadRun();
      if (!session || !run || run.phase !== "done") {
        if (session && session.dayCode) {
          location.href = "board.html?d=" + encodeURIComponent(session.dayCode);
        } else {
          location.href = "index.html";
        }
        return;
      }
      const total = run.queue.length;
      UI.$("#typeLine").textContent = Game.typeLabel(run.gameType);
      UI.$("#scoreBig").textContent = String(run.score);
      UI.$("#scoreSub").textContent = "/ " + total;
      UI.$("#dayPill").textContent = session.dayCode;
      UI.$("#namePill").textContent = session.name || "Player";
      UI.$("#boardLink").href = "board.html?d=" + encodeURIComponent(session.dayCode);
      const text = Game.shareText({
        dayCode: session.dayCode,
        gameType: run.gameType,
        playerName: session.name,
        score: run.score,
        total,
      });
      UI.$("#shareBox").textContent = text;
      UI.$("#copyBtn").onclick = () => UI.copyText(text);
      UI.$("#againLink").addEventListener("click", () => {
        Sync.clearSession();
        Sync.clearRun();
      });
    })();
  </script>
</body>
</html>
